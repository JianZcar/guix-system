[audio]
sound_theme = "Yaru"
sound_volume = 1.0

[bar]
order = [ "default" ]

    [bar.default]
    start = [ "group:g1", "group:g2", "group:g3" ]
    center = [ "notifications", "clock", "clipboard" ]
    end = [ "tray", "group:g4", "session" ]
    margin_ends = "10%"
    panel_overlap = 0
    widget_spacing = 12

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "control-center", "launcher" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "workspaces", "layout" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g3"
        members = [ "wallpaper", "depth", "media" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "tailnet", "network", "bluetooth", "volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 6.0 

[brightness]
minimum_brightness = 0.01

[desktop_widgets]
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[osd]
position = "bottom_center"
position_vertical = "center_right"

[shell]
date_format = "%x"
password_style = "random"
polkit_agent = true
time_format = "{:%I:%M %p}"

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "pkexec"

[theme]
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "mango" ]

[wallpaper]
transition = [ "honeycomb" ]
transition_duration = 2500
transition_on_startup = true

[widget.workspaces]
show_labels = false

[widget.clock]
anchor = true
format = "{:%I:%M %p}"

[plugin_settings."ezequiel/mango_layouts"]
list_mode = true
panel_position = "center"

[plugin_settings."rylos/tailnet"]
panel_open_near_click = false

[plugins]
enabled = [ "noctalia/wallpaper_depth", "ezequiel/mango_layouts", "kenn/keybind-cheatsheet", "gambled23/mangowm-keymode", "rylos/tailnet" ]

[widget.layout]
show_text = true
type = "ezequiel/mango_layouts:btn"

[widget.depth]
type = "noctalia/wallpaper_depth:bar"

[widget.tailnet]
type = "rylos/tailnet:bar"

[hooks]
started = "canberra-gtk-play -i desktop-login"
